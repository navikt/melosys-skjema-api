name: deploy-dev
on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "CODEOWNERS"
    branches:
      - main
permissions:
  contents: write
  packages: write
  id-token: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build application
        run: ./gradlew build
        env:
          DB_USERNAME: melosys
          DB_PASSWORD: melosys
      - name: Build and publish Docker images (multi-arch)
        id: docker-push
        uses: nais/docker-build-push@v0
        with:
          team: teammelosys
          tag: |
            type=raw,value=latest,priority=9001
            type=raw,value=${{ github.sha }},priority=9000
          platforms: linux/amd64,linux/arm64

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: pre-deploy
        uses: navikt/digihot-deploy/actions/pre-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy til dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          # ApiToken-CR-en applyes før appen, men secreten materialiseres asynkront av
          # Unleash-operatoren - aller første deploy kan trenge en retry hvis podden
          # rekker å starte før secreten finnes (selvhelende via kubelet).
          RESOURCE: .nais/unleash-apitoken-dev.yaml,.nais/app-dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "${{ job.status == 'success' && 'good' || 'danger' }}"
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: "melosys-skjema-api ${{ job.status == 'success' && 'ble deployet' || 'kunne ikke deployes' }} til dev-gcp"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: ${{ env.COMMIT_MSG }}
      - name: post-deploy
        uses: navikt/digihot-deploy/actions/post-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: draft release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.APPLICATION }} ${{ env.VERSION_TAG }}
          body: ${{ env.CHANGE_LOG }}
          draft: true
          prerelease: false

  # Har en label-kjøring (e2e-pr.yml) alt testet nøyaktig denne koden grønt,
  # finnes markøren e2e-ok-<tree>, og e2e-dispatch hoppes over.
  # Jobben stopper aldri e2e: enhver feil gir hit=false (en timeout gir tom hit), og da kjører e2e som før.
  e2e-marker:
    name: Slå opp e2e-markør
    # Etter bygget, så en label-kjøring som blir ferdig like etter merge, rekker å
    # sette markøren. trigger-e2e-tests venter uansett på deploy.
    needs: build
    runs-on: ubuntu-latest
    # En timeout gir tom hit, og da kjører e2e som før.
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    outputs:
      hit: ${{ steps.marker.outputs.hit }}
    steps:
      - name: Login to NAIS registry
        uses: nais/login@v0
        continue-on-error: true
        with:
          team: teammelosys
      - name: Finnes e2e-ok-<tree>?
        id: marker
        env:
          IMAGE: europe-north1-docker.pkg.dev/nais-management-233d/teammelosys/melosys-skjema-api
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          if [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] && docker manifest inspect "$IMAGE:e2e-ok-$TREE" > /dev/null 2>&1; then
            hit=true
          else
            hit=false
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "e2e-marker: hit=$hit (tree ${TREE:-ukjent})" | tee -a "$GITHUB_STEP_SUMMARY"

  trigger-e2e-tests:
    name: Trigger E2E tests
    runs-on: ubuntu-latest
    needs: [ build, deploy, e2e-marker ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy.result == 'success' && needs.e2e-marker.outputs.hit != 'true' }}
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Trigger E2E tests in melosys-e2e-tests
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.E2E_TRIGGER_PAT }}
          repository: navikt/melosys-e2e-tests
          event-type: melosys-skjema-api-published
          client-payload: |
            {
              "repository": "melosys-skjema-api",
              "image_tag": "${{ github.sha }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": ${{ toJSON(env.COMMIT_MSG) }},
              "actor": "${{ github.actor }}"
            }
