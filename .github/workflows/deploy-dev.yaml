name: deploy-dev
on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "CODEOWNERS"
    branches:
      - main
permissions:
  contents: write
  packages: write
  id-token: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build application
        run: ./gradlew build
        env:
          DB_USERNAME: melosys
          DB_PASSWORD: melosys
      - name: Build and publish Docker images (multi-arch)
        id: docker-push
        uses: nais/docker-build-push@v0
        with:
          team: teammelosys
          tag: |
            type=raw,value=latest,priority=9001
            type=raw,value=${{ github.sha }},priority=9000
          platforms: linux/amd64,linux/arm64

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: pre-deploy
        uses: navikt/digihot-deploy/actions/pre-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy til dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          # ApiToken-CR-en applyes før appen, men secreten materialiseres asynkront av
          # Unleash-operatoren - aller første deploy kan trenge en retry hvis podden
          # rekker å starte før secreten finnes (selvhelende via kubelet).
          RESOURCE: .nais/unleash-apitoken-dev.yaml,.nais/app-dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "${{ job.status == 'success' && 'good' || 'danger' }}"
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: "melosys-skjema-api ${{ job.status == 'success' && 'ble deployet' || 'kunne ikke deployes' }} til dev-gcp"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: ${{ env.COMMIT_MSG }}
      - name: post-deploy
        uses: navikt/digihot-deploy/actions/post-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: draft release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.APPLICATION }} ${{ env.VERSION_TAG }}
          body: ${{ env.CHANGE_LOG }}
          draft: true
          prerelease: false

  trigger-e2e-tests:
    name: Trigger E2E tests
    runs-on: ubuntu-latest
    needs: [ build, deploy ]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Trigger E2E tests in melosys-e2e-tests
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.E2E_TRIGGER_PAT }}
          repository: navikt/melosys-e2e-tests
          event-type: melosys-skjema-api-published
          client-payload: |
            {
              "repository": "melosys-skjema-api",
              "image_tag": "${{ github.sha }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ env.COMMIT_MSG }}",
              "actor": "${{ github.actor }}"
            }
