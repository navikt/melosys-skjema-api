name: Gradle Test
# Ingen paths-filter: Build og test er påkrevd, og en PR som bare endrer andre filer
# (for eksempel Dependabots Actions-bumper) ville ellers aldri fått sjekken.
on:
  pull_request:
    branches:
      - 'main'
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  packages: read
  pull-requests: write
  checks: write
jobs:
  build:
    name: Build og test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build og test
        run: ./gradlew build
        env:
          DB_USERNAME: melosys
          DB_PASSWORD: melosys
      - name: Test Report
        uses: mikepenz/action-junit-report@v6.5.0
        if: success() || failure()
        with:
          check_name: 'Tester'
          report_paths: '**/build/test-results/test/TEST-*.xml'
